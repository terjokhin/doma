# On a version tag (v0.1.0, …): build the Docker image for the usual Home Assistant hosts, push it to GitHub's
# container registry as ghcr.io/<owner>/doma:<version> and :latest, and make a GitHub release that says how to run it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release
  packages: write # the image

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # The app is built once, on the runner's own platform (see the Dockerfile); only nginx is per platform.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag is the only place the version is written; the app shows it (package.json says 0.0.0-dev).
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          {
            echo 'Docker image for amd64, arm64 and arm/v7:'
            echo
            echo '```sh'
            echo 'docker run -d --name doma --restart unless-stopped -p 8080:8080 \'
            echo "  -e HA_URL=http://homeassistant.local:8123 $image:$VERSION"
            echo '```'
          } > notes.md
          prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          gh release create "$TAG" --verify-tag --title "Doma $VERSION" --notes-file notes.md --generate-notes $prerelease
