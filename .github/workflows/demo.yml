# On a version tag (v0.3.0, …), or by hand: build the app on the made-up demo home (fixtures/demo.json) and publish
# it on GitHub Pages, so anyone can try Doma in a browser without a Home Assistant. Nothing in it reaches a real HA.
name: Demo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # the site
  id-token: write # proves the deployment comes from this workflow

# One deployment at a time; a newer tag replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The version the app shows in settings: the tag's, as in the Docker image.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      # Opens on the demo home without ?fixture=demo; type check and size budget as in every build.
      - run: npm run build
        env:
          VITE_FIXTURE: demo

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
